<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SET APART | Contact</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<nav>

    <h2>SET APART</h2>

    <ul>

        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="shop.html">Shop</a>

        <li>
            <a href="about.html">About</a>

        <li>
            <a href="contact.html">Contact</a>
        </li>

    </ul>

</nav>



<!-- ========================= -->
<!-- CONTACT -->
<!-- ========================= -->

<section class="mission">

    <h1>Contact Us</h1>

    <p>We'd love to hear from you.</p>

    <p>📧 Email: setapart1804@gmail.com</p>

    <p>📱 Instagram: @setapart</p>

    <p>🎵 TikTok: @setapart</p>


    <!-- CONTACT FORM -->

    <form
        class="contact-form"
        onsubmit="sendMessage(event)"
    >

        <input
            type="text"
            id="name"
            placeholder="Your Name"
            required
        >


        <input
            type="email"
            id="email"
            placeholder="Your Email"
            required
        >


        <textarea
            id="message"
            placeholder="Your Message"
            rows="6"
            required
        ></textarea>


        <button
            type="submit"
            class="btn"
        >
            Send Your Message
        </button>

    </form>

</section>



<!-- ========================= -->
<!-- FOOTER -->
<!-- ========================= -->

<footer>

    <h3>SET APART</h3>

    <p>Faith-Inspired Streetwear</p>

    <p>©️ 2026 SET APART. All Rights Reserved.</p>

</footer>



<!-- ========================= -->
<!-- SEND MESSAGE -->
<!-- ========================= -->

<script>

function sendMessage(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const message =
        document.getElementById("message").value;


    const text =
        "Hello SET APART,%0A%0A" +
        "Name: " + encodeURIComponent(name) +
        "%0A" +
        "Email: " + encodeURIComponent(email) +
        "%0A%0A" +
        "Message:%0A" +
        encodeURIComponent(message);


    const whatsappNumber = "18494861203";


    window.open(
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        text,
        "_blank"
    );

}

</script>


</body>
</html>
