<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shop — SET APART</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        /* =========================================
           SHOP PRODUCT DETAIL LAYOUT
        ========================================= */

        .shop-detail-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 70px 30px 100px;
        }


        .shop-detail {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(350px, .85fr);
            gap: 70px;
            align-items: start;
            margin-bottom: 120px;
        }


        /* =========================================
           PRODUCT IMAGE
        ========================================= */

        .detail-gallery {
            width: 100%;
        }


        .detail-slider {
            width: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }


        .detail-slider::-webkit-scrollbar {
            display: none;
        }


        .detail-slide {
            min-width: 100%;
            flex: 0 0 100%;
            scroll-snap-align: start;
        }


        .detail-slide img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }


        .detail-image-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
        }


        .detail-arrows {
            display: flex;
            gap: 8px;
        }


        .detail-arrow {
            width: 42px;
            height: 42px;
            border: 1px solid #111;
            background: #fff;
            color: #111;
            cursor: pointer;
            font-size: 18px;
            transition: .2s ease;
        }


        .detail-arrow:hover {
            background: #111;
            color: #fff;
        }


        .detail-image-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
        }


        /* =========================================
           PRODUCT INFORMATION
        ========================================= */

        .detail-info {
            padding-top: 5px;
        }


        .detail-product-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0 0 15px;
            opacity: .65;
        }


        .detail-info h2 {
            margin: 0;
            font-size: 32px;
            line-height: 1.1;
            letter-spacing: 1px;
        }


        .detail-price {
            margin: 18px 0 35px;
            font-size: 18px;
            font-weight: 700;
        }


        /* =========================================
           COLOR
        ========================================= */

        .detail-option {
            margin-bottom: 32px;
        }


        .detail-option-title {
            display: block;
            margin-bottom: 14px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
        }


        .color-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }


        .color-button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            padding: 0;
            position: relative;
            transition: .2s ease;
        }


        .color-button:hover {
            transform: scale(1.08);
        }


        .color-button.selected {
            border-color: #111;
            box-shadow:
                0 0 0 2px #fff,
                0 0 0 3px #111;
        }


        .color-button[data-color="black"] {
            background: #111;
        }


        .color-button[data-color="white"] {
            background: #fff;
            border: 1px solid #aaa;
        }


        .color-button[data-color="white"].selected {
            border: 2px solid #111;
        }


        .color-button[data-color="brown"] {
            background: #6b4226;
        }


        .color-button[data-color="beige"] {
            background: #d8c2a4;
        }


        .current-color {
            margin-top: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }


        /* =========================================
           SIZE
        ========================================= */

        .size-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }


        .detail-size-button {
            min-width: 48px;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #111;
            background: #fff;
            color: #111;
            cursor: pointer;
            font-weight: 700;
            transition: .2s ease;
        }


        .detail-size-button:hover,
        .detail-size-button.selected {
            background: #111;
            color: #fff;
        }


        /* =========================================
           ACTION BUTTONS
        ========================================= */

        .detail-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 35px;
        }


        .detail-add-cart,
        .detail-buy-now {
            width: 100%;
            min-height: 54px;
            border: 1px solid #111;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            transition: .2s ease;
        }


        .detail-add-cart {
            background: #111;
            color: #fff;
        }


        .detail-add-cart:hover {
            background: #333;
        }


        .detail-buy-now {
            background: #fff;
            color: #111;
        }


        .detail-buy-now:hover {
            background: #111;
            color: #fff;
        }


        /* =========================================
           DIVIDER
        ========================================= */

        .product-divider {
            width: 100%;
            height: 1px;
            background: #ddd;
            margin-top: 20px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 850px) {

            .shop-detail-section {
                padding: 50px 20px 80px;
            }


            .shop-detail {
                grid-template-columns: 1fr;
                gap: 40px;
                margin-bottom: 80px;
            }


            .detail-info {
                padding-top: 0;
            }


            .detail-info h2 {
                font-size: 27px;
            }

        }


        @media (max-width: 500px) {

            .shop-detail-section {
                padding-left: 15px;
                padding-right: 15px;
            }


            .detail-info h2 {
                font-size: 24px;
            }


            .detail-image-controls {
                margin-top: 12px;
            }


            .detail-arrow {
                width: 38px;
                height: 38px;
            }


            .color-button {
                width: 34px;
                height: 34px;
            }

        }

    </style>

</head>
