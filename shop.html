<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop — SET APART</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================================
   SHOP PAGE
========================================================= */

body {
    background: #111;
    color: #fff;
}


/* =========================================================
   SHOP HERO
========================================================= */

.shop-hero {
    padding: 90px 30px 55px;
    text-align: center;
    background: #111;
}

.shop-hero p {
    font-size: 12px;
    letter-spacing: 3px;
    color: #aaa;
    margin: 0 0 15px;
}

.shop-hero h1 {
    font-size: clamp(42px, 7vw, 80px);
    letter-spacing: 2px;
    margin: 0;
}

.shop-hero span {
    display: block;
    margin-top: 15px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #aaa;
}


/* =========================================================
   PRODUCTS
========================================================= */

.shop-products {

    width: min(1500px, 94%);

    margin: 0 auto;

    padding: 35px 0 100px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 55px;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.shop-product {

    min-width: 0;

    background: #111;

}


/* =========================================================
   PRODUCT LAYOUT
========================================================= */

.product-layout {

    display: grid;

    grid-template-columns:
        minmax(0, 1.25fr)
        minmax(260px, .75fr);

    gap: 35px;

    align-items: start;
}


/* =========================================================
   GALLERY
========================================================= */

.product-gallery {

    min-width: 0;

}


/* =========================================================
   SLIDER
========================================================= */

.product-slider {

    width: 100%;

    aspect-ratio: 1 / 1;

    display: flex;

    overflow-x: auto;

    scroll-snap-type: x mandatory;

    scroll-behavior: smooth;

    scrollbar-width: none;

    background: #f5f5f5;

}

.product-slider::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   SLIDE
========================================================= */

.product-slide {

    min-width: 100%;

    width: 100%;

    height: 100%;

    flex: 0 0 100%;

    scroll-snap-align: start;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #f5f5f5;

    overflow: hidden;

}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-slide img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: contain;

    object-position: center;

    user-select: none;

    -webkit-user-drag: none;

}


/* =========================================================
   GALLERY CONTROLS
========================================================= */

.gallery-controls {

    width: 100%;

    display: flex;

    justify-content: flex-start;

    align-items: center;

    margin-top: 14px;

}


/*
   IMPORTANT:
   NO "HOODIE" LABEL HERE.
*/

.image-arrows {

    display: flex;

    gap: 8px;

}


/* =========================================================
   ARROWS
========================================================= */

.image-arrow {

    width: 46px;

    height: 40px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: transparent;

    color: #fff;

    border: 1px solid #555;

    cursor: pointer;

    font-size: 18px;

    transition: .2s;

}

.image-arrow:hover {

    background: #fff;

    color: #111;

}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info {

    padding-top: 3px;

    min-width: 0;

}


.product-brand {

    margin: 0 0 10px;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 3px;

    color: #aaa;

}


.product-name {

    margin: 0 0 18px;

    font-size: clamp(24px, 2.6vw, 38px);

    line-height: 1.05;

    letter-spacing: 1px;

    font-weight: 800;

}


.product-price {

    margin: 0 0 32px;

    font-size: 19px;

    font-weight: 700;

}


/* =========================================================
   COLOR
========================================================= */

.product-option-title {

    display: block;

    margin-bottom: 12px;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 2px;

}


.color-buttons {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 11px;

}


.color-btn {

    width: 34px;

    height: 34px;

    padding: 0;

    border-radius: 50%;

    border: 1px solid #555;

    cursor: pointer;

    position: relative;

    transition: .2s;

}


.color-btn:hover {

    transform: scale(1.08);

}


.color-btn.selected {

    box-shadow:
        0 0 0 2px #111,
        0 0 0 3px #fff;

}


/* COLORS */

.color-btn.black {
    background: #111;
}

.color-btn.white {
    background: #fff;
}

.color-btn.brown {
    background: #6b4226;
}

.color-btn.beige {
    background: #d8c2a4;
}


.selected-color {

    margin: 0 0 30px;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 2px;

    color: #bbb;

}


/* =========================================================
   SIZE
========================================================= */

.size-title {

    display: block;

    margin-bottom: 12px;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 2px;

}


.size-buttons {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;

    margin-bottom: 25px;

}


.size-btn {

    width: 48px;

    height: 42px;

    background: transparent;

    color: #fff;

    border: 1px solid #555;

    cursor: pointer;

    font-size: 11px;

    font-weight: 700;

    transition: .2s;

}


.size-btn:hover {

    border-color: #fff;

}


.size-btn.selected {

    background: #fff;

    color: #111;

    border-color: #fff;

}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.product-actions {

    display: flex;

    flex-direction: column;

    gap: 9px;

}


.add-cart-btn,
.buy-now-btn {

    width: 100%;

    min-height: 48px;

    border: none;

    cursor: pointer;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 2px;

    transition: .2s;

}


.add-cart-btn {

    background: #fff;

    color: #111;

}


.add-cart-btn:hover {

    background: #ddd;

}


.buy-now-btn {

    background: transparent;

    color: #fff;

    border: 1px solid #555;

}


.buy-now-btn:hover {

    background: #fff;

    color: #111;

}


/* =========================================================
   CART COUNT
========================================================= */

.cart-count {

    display: none;

    align-items: center;

    justify-content: center;

    position: absolute;

    top: -7px;

    right: -7px;

    width: 18px;

    height: 18px;

    background: #fff;

    color: #111;

    border-radius: 50%;

    font-size: 10px;

    font-weight: 800;

}


.cart-btn {

    position: relative;

}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1100px) {

    .shop-products {

        grid-template-columns: 1fr;

        width: min(850px, 94%);

        gap: 75px;

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .shop-hero {

        padding: 65px 20px 45px;

    }


    .shop-products {

        width: 92%;

        padding-top: 20px;

        padding-bottom: 70px;

        gap: 70px;

    }


    .product-layout {

        grid-template-columns: 1fr;

        gap: 30px;

    }


    .product-info {

        padding: 0 3px;

    }


    .product-name {

        font-size: 30px;

    }


    .product-price {

        margin-bottom: 28px;

    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 430px) {

    .product-name {

        font-size: 27px;

    }


    .product-slider {

        aspect-ratio: 1 / 1;

    }


    .size-btn {

        width: 46px;

    }

}

</style>

</head>
