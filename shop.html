<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop — SET APART</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================================
   SHOP PAGE
========================================================= */

body {
    background: #111;
    color: #fff;
}


/* =========================================================
   SHOP HERO
========================================================= */

.shop-hero {
    padding: 100px 40px 70px;
    text-align: center;
    background: #111;
}

.shop-hero p {
    font-size: 12px;
    letter-spacing: 3px;
    color: #aaa;
    margin-bottom: 15px;
}

.shop-hero h1 {
    font-size: clamp(42px, 7vw, 80px);
    letter-spacing: 2px;
    margin: 0;
}

.shop-hero span {
    display: block;
    margin-top: 15px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #aaa;
}


/* =========================================================
   PRODUCTS
========================================================= */

.shop-products {
    width: min(1400px, 94%);
    margin: 0 auto;
    padding: 40px 0 100px;

    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 70px;
}


/* =========================================================
   PRODUCT CARD
========================================================= */

.shop-product {
    background: #111;
    min-width: 0;
}


/* =========================================================
   PRODUCT LAYOUT
========================================================= */

.product-layout {
    display: grid;

    grid-template-columns:
        minmax(0, 1.65fr)
        minmax(260px, .85fr);

    gap: 55px;

    align-items: start;
}


/* =========================================================
   GALLERY
========================================================= */

.product-gallery {
    min-width: 0;
}


/* =========================================================
   IMAGE SLIDER
========================================================= */

.product-slider {

    width: 100%;

    display: flex;

    overflow-x: auto;

    scroll-snap-type: x mandatory;

    scrollbar-width: none;

    background: #f5f5f5;

    scroll-behavior: smooth;

    /*
     * Retire aspect-ratio 1/1 la.
     * Sa bay foto hoodie yo plis espas
     * pou yo parèt antye.
     */
    min-height: 520px;
}

.product-slider::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   PRODUCT SLIDE
========================================================= */

.product-slide {

    min-width: 100%;

    flex: 0 0 100%;

    scroll-snap-align: start;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #f5f5f5;

    min-height: 520px;

    overflow: hidden;
}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-slide img {

    display: block;

    width: 100%;

    height: auto;

    max-width: 100%;

    max-height: 620px;

    object-fit: contain;

    object-position: center;

    user-select: none;
}


/* =========================================================
   ARROWS
========================================================= */

.gallery-controls {

    display: flex;

    justify-content: flex-start;

    align-items: center;

    margin-top: 18px;
}


.image-arrows {

    display: flex;

    gap: 8px;
}


.image-arrow {

    width: 48px;

    height: 42px;

    background: transparent;

    color: #fff;

    border: 1px solid #555;

    cursor: pointer;

    font-size: 18px;

    transition: .2s;
}


.image-arrow:hover {

    background: #fff;

    color: #111;
}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info {

    padding-top: 5px;
}


.product-brand {

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 3px;

    color: #aaa;

    margin: 0 0 8px;
}


/*
 * HOODIE APRE SET APART
 */

.product-type {

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 3px;

    color: #aaa;

    margin: 0 0 10px;
}


.product-name {

    font-size: clamp(25px, 3vw, 42px);

    line-height: 1.05;

    letter-spacing: 1px;

    margin: 0 0 22px;

    font-weight: 800;
}


.product-price {

    font-size: 20px;

    font-weight: 700;

    margin-bottom: 42px;
}


/* =========================================================
   COLOR
========================================================= */

.product-option-title {

    display: block;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 2px;

    margin-bottom: 14px;
}


.color-buttons {

    display: flex;

    gap: 12px;

    flex-wrap: wrap;

    margin-bottom: 12px;
}


.color-btn {

    width: 38px;

    height: 38px;

    border-radius: 50%;

    border: 1px solid #555;

    cursor: pointer;

    padding: 0;

    position: relative;

    transition: .2s;
}


.color-btn:hover {

    transform: scale(1.08);
}


.color-btn.selected {

    box-shadow:
        0 0 0 2px #111,
        0 0 0 3px #fff;
}


/* COLORS */

.color-btn.black {
    background: #111;
}


.color-btn.white {
    background: #fff;
}


.color-btn.brown {
    background: #6b4226;
}


.color-btn.beige {
    background: #d8c2a4;
}


.selected-color {

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 2px;

    color: #bbb;

    margin-bottom: 40px;
}


/* =========================================================
   SIZE
========================================================= */

.size-title {

    display: block;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 2px;

    margin-bottom: 14px;
}


.size-buttons {

    display: flex;

    gap: 8px;

    margin-bottom: 32px;
}


.size-btn {

    width: 52px;

    height: 46px;

    background: transparent;

    color: #fff;

    border: 1px solid #555;

    cursor: pointer;

    font-weight: 700;

    transition: .2s;
}


.size-btn:hover {

    border-color: #fff;
}


.size-btn.selected {

    background: #fff;

    color: #111;

    border-color: #fff;
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.product-actions {

    display: flex;

    flex-direction: column;

    gap: 10px;
}


.add-cart-btn,
.buy-now-btn {

    width: 100%;

    min-height: 50px;

    border: none;

    cursor: pointer;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 2px;

    transition: .2s;
}


.add-cart-btn {

    background: #fff;

    color: #111;
}


.add-cart-btn:hover {

    background: #ddd;
}


.buy-now-btn {

    background: transparent;

    color: #fff;

    border: 1px solid #555;
}


.buy-now-btn:hover {

    background: #fff;

    color: #111;
}


/* =========================================================
   CART COUNT
========================================================= */

.cart-count {

    display: none;

    align-items: center;

    justify-content: center;

    position: absolute;

    top: -7px;

    right: -7px;

    width: 18px;

    height: 18px;

    background: #fff;

    color: #111;

    border-radius: 50%;

    font-size: 10px;

    font-weight: 800;
}


.cart-btn {

    position: relative;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 1000px) {

    .shop-products {

        grid-template-columns: 1fr;

        width: min(760px, 94%);
    }

}


/* =========================================================
   TABLET / PHONE
========================================================= */

@media (max-width: 700px) {

    .shop-hero {

        padding: 70px 20px 45px;
    }


    .shop-products {

        width: 92%;

        gap: 70px;

        padding-bottom: 70px;
    }


    .product-layout {

        grid-template-columns: 1fr;

        gap: 35px;
    }


    .product-info {

        padding: 0 5px;
    }


    .product-price {

        margin-bottom: 30px;
    }


    .selected-color {

        margin-bottom: 30px;
    }


    /*
     * MOBILE GALLERY
     */

    .product-slider {

        min-height: 420px;
    }


    .product-slide {

        min-height: 420px;
    }


    .product-slide img {

        max-height: 500px;
    }

}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media (max-width: 430px) {

    .size-btn {

        width: 48px;
    }


    .product-name {

        font-size: 27px;
    }


    .product-slider {

        min-height: 380px;
    }


    .product-slide {

        min-height: 380px;
    }


    .product-slide img {

        max-height: 440px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     ANNOUNCEMENT
======================================================= -->

<div class="announcement">
    NEW DROP — CALLED TO LIVE DIFFERENTLY.
</div>


<!-- =======================================================
     NAVBAR
======================================================= -->

<header class="navbar">

    <button
        type="button"
        class="menu-toggle"
        id="menuToggle"
        aria-label="Open menu"
        aria-expanded="false">

        ☰

    </button>


    <a
        href="index.html"
        class="logo">

        <img
            src="LOGO (2).png"
            alt="SET APART Logo">

    </a>


    <nav id="mainNav">

        <a href="index.html">
            HOME
        </a>

        <a href="shop.html">
            SHOP
        </a>

        <a href="about.html">
            ABOUT
        </a>

        <a href="contact.html">
            CONTACT
        </a>

    </nav>


    <div class="nav-icons">

        <button
            type="button"
            class="search-btn"
            id="searchButton"

            ⌕

        </button>


        <button
            type="button"
            class="cart-btn"
            id="cartButton"

            🛒

            <span
                class="cart-count"
                id="cartCount">

                0

            </span>

<!-- =======================================================
     SEARCH
======================================================= -->

<div
    class="search-box"
    id="searchBox">

    <form id="searchForm">

        <input
            type="search"
            id="searchInput"
            placeholder="Search products..."
            autocomplete="off">


        <button
            type="button"
            id="closeSearch"
            class="close-search">

            ×

        </button>

    </form>
