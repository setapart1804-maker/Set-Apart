<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cart — SET APART</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           CART PAGE
        ========================= */

        .cart-page {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .cart-title {
            margin-bottom: 40px;
        }

        .cart-title p {
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .cart-title h1 {
            margin: 0;
            font-size: 42px;
        }


        /* CART ITEM */

        .cart-item {
            display: grid;
            grid-template-columns: 180px 1fr auto;
            gap: 30px;
            align-items: center;

            padding: 25px 0;

            border-top: 1px solid #ddd;
        }

        .cart-item-image img {
            width: 100%;
            display: block;
        }

        .cart-item-info h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .cart-item-info p {
            margin: 6px 0;
        }

        .cart-item-price {
            font-size: 20px;
            font-weight: 700;
        }


        /* QUANTITY */

        .quantity {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
        }

        .quantity button {
            width: 35px;
            height: 35px;

            background: #fff;
            color: #111;

            border: 1px solid #111;

            cursor: pointer;
        }

        .quantity span {
            min-width: 20px;
            text-align: center;
        }


        /* REMOVE */

        .remove-item {
            margin-top: 15px;

            background: none;
            border: none;

            text-decoration: underline;

            cursor: pointer;
        }


        /* TOTAL */

        .cart-summary {
            margin-top: 40px;
            padding-top: 25px;

            border-top: 1px solid #111;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-total {
            font-size: 24px;
            font-weight: 700;
        }

        .checkout-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 52px;
            padding: 0 35px;

            background: #111;
            color: #fff;

            border: 1px solid #111;

            font-weight: 700;
            letter-spacing: 1px;

            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #333;
        }


        /* EMPTY CART */

        .empty-cart {
            padding: 60px 20px;
            text-align: center;
            border-top: 1px solid #ddd;
        }

        .empty-cart h2 {
            margin-bottom: 15px;
        }

        .continue-shopping {
            display: inline-flex;

            margin-top: 20px;
            padding: 15px 25px;

            background: #111;
            color: #fff;

            text-decoration: none;
            font-weight: 700;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .cart-page {
                margin: 40px auto;
                padding: 0 15px;
            }

            .cart-title h1 {
                font-size: 34px;
            }

            .cart-item {
                grid-template-columns: 110px 1fr;
                gap: 20px;
            }

            .cart-item-price {
                grid-column: 2;
            }

            .cart-summary {
                flex-direction: column;
                align-items: stretch;
                gap: 20px;
            }

            .checkout-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- ANNOUNCEMENT -->

    <div class="announcement">
        NEW DROP — CALLED TO LIVE DIFFERENTLY.
    </div>


    <!-- NAVBAR -->

    <header class="navbar">

        <button
            type="button"
            class="menu-toggle"
            id="menuToggle"
            aria-label="Open menu"
            aria-expanded="false">

            ☰

        </button>


        <a href="index.html" class="logo">

            <img
                src="LOGO (2).png"
                alt="SET APART Logo">

        </a>


        <nav id="mainNav">

            <a href="index.html">HOME</a>

            <a href="shop.html">SHOP</a>

            <a href="about.html">ABOUT</a>

            <a href="contact.html">CONTACT</a>

        </nav>


        <div class="nav-icons">

            <button
                type="button"
                class="search-btn"
                aria-label="Search">

                🔍

            </button>

            <button
                type="button"
                class="cart-btn"
                aria-label="Shopping Cart">

                🛒

            </button>

        </div>

    </header>


    <!-- CART -->

    <main>

        <section class="cart-page">

            <div class="cart-title">

                <p>
                    SET APART COLLECTION
                </p>

                <h1>
                    YOUR CART
                </h1>

            </div>


            <div id="cartContent"></div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-brand">

            <img
                src="LOGO (2).png"
                alt="SET APART Logo">

            <p>
                Faith-Inspired Streetwear.
            </p>

            <p>
                Called to Live Differently.
            </p>

        </div>


        <div class="footer-links">

            <div>

                <h3>SHOP</h3>

                <a href="shop.html">
                    All Products
                </a>

                <a href="shop.html">
                    Hoodies
                </a>

            </div>


            <div>

                <h3>ABOUT</h3>

                <a href="about.html">
                    Our Story
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </div>


            <div>

                <h3>FOLLOW</h3>

                <a href="#">
                    Instagram
                </a>

                <a href="#">
                    TikTok
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 SET APART. ALL RIGHTS RESERVED.
            </p>

        </div>

    </footer>


    <!-- CART JAVASCRIPT -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const cartContent =
                    document.getElementById("cartContent");

                let cart =
                    JSON.parse(
                        localStorage.getItem("setApartCart")
                    );


                function displayCart() {

                    if (!cart) {

                        cartContent.innerHTML = `

                            <div class="empty-cart">

                                <h2>
                                    YOUR CART IS EMPTY.
                                </h2>

                                <p>
                                    Add a product to your cart
                                    to get started.
                                </p>

                                <a
                                    href="shop.html"
                                    class="continue-shopping">

                                    CONTINUE SHOPPING

                                </a>

                            </div>

                        `;

                        return;
                    }


                    const total =
                        Number(cart.price) *
                        Number(cart.quantity);


                    cartContent.innerHTML = `

                        <div class="cart-item">

                            <div class="cart-item-image">

                                <img
                                    src="${cart.image}"
                                    alt="${cart.name}">

                            </div>


                            <div class="cart-item-info">

                                <h2>
                                    ${cart.name}
                                </h2>

                                <p>
                                    SIZE: ${cart.size}
                                </p>

                                <p class="cart-item-price">
                                    $${Number(cart.price).toFixed(2)}
                                </p>


                                <div class="quantity">

                                    <button
                                        type="button"
                                        id="decrease">

                                        −

                                    </button>

                                    <span>
                                        ${cart.quantity}
                                    </span>

                                    <button
                                        type="button"
                                        id="increase">

                                        +

                                    </button>

                                </div>


                                <button
                                    type="button"
                                    class="remove-item"
                                    id="removeItem">

                                    REMOVE

                                </button>

                            </div>

                        </div>


                        <div class="cart-summary">

                            <div>

                                <span>
                                    TOTAL
                                </span>

                                <div class="cart-total">
                                    $${total.toFixed(2)}
                                </div>

                            </div>


                            <button
                                type="button"
                                class="checkout-btn"
                                id="checkoutBtn">

                                CHECKOUT

                            </button>

                        </div>

                    `;


                    document
                        .getElementById("increase")
                        .addEventListener(
                            "click",
                            function () {

                                cart.quantity++;

                                saveCart();

                            }
                        );


                    document
                        .getElementById("decrease")
                        .addEventListener(
                            "click",
                            function () {

                                if (cart.quantity > 1) {

                                    cart.quantity--;

                                    saveCart();

                                }

                            }
                        );


                    document
                        .getElementById("removeItem")
                        .addEventListener(
                            "click",
                            function () {

                                localStorage.removeItem(
                                    "setApartCart"
                                );

                                cart = null;

                                displayCart();

                            }
                        );


                    document
                        .getElementById("checkoutBtn")
                        .addEventListener(
                            "click",
                            function () {

                                alert(
                                    "CHECKOUT WILL BE AVAILABLE SOON."
                                );

                            }
                        );

                }


                function saveCart() {

                    localStorage.setItem(
                        "setApartCart",
                        JSON.stringify(cart)
                    );

                    displayCart();

                }


                displayCart();

            }
        );

    </script>


</body>

</html>
