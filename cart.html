<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cart — SET APART</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
           CART PAGE
        ========================================= */

        .cart-page {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .cart-title {
            margin-bottom: 40px;
        }

        .cart-title p {
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .cart-title h1 {
            margin: 0;
            font-size: 42px;
        }


        /* =========================================
           CART PRODUCT
        ========================================= */

        .cart-item {
            display: grid;
            grid-template-columns: 330px 1fr;
            gap: 50px;
            align-items: start;

            padding: 45px 0;

            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }


        /* =========================================
           PRODUCT IMAGE
        ========================================= */

        .cart-item-image {
            width: 330px;
            max-width: 330px;
        }

        .cart-item-image img {
            width: 100%;
            max-width: 330px;
            height: auto;

            display: block;

            object-fit: contain;
        }


        /* =========================================
           PRODUCT INFORMATION
        ========================================= */

        .cart-item-info {
            padding-top: 65px;
        }

        .cart-item-info h2 {
            margin: 0 0 28px;

            font-size: 34px;
            line-height: 1.1;

            font-weight: 700;
        }

        .cart-item-info p {
            margin: 18px 0;

            font-size: 20px;
            line-height: 1.4;
        }

        .cart-item-info strong {
            font-weight: 700;
        }

        .cart-item-price {
            margin-top: 35px !important;

            font-size: 30px !important;
            font-weight: 700;
        }


        /* =========================================
           QUANTITY
        ========================================= */

        .quantity {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-top: 28px;
        }

        .quantity button {
            width: 38px;
            height: 38px;

            background: #fff;
            color: #111;

            border: 1px solid #111;

            font-size: 20px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: all 0.2s ease;
        }

        .quantity button:hover {
            background: #111;
            color: #fff;
        }

        .quantity span {
            min-width: 25px;

            text-align: center;

            font-size: 18px;
            font-weight: 700;
        }


        /* =========================================
           REMOVE
        ========================================= */

        .remove-item {
            margin-top: 25px;

            padding: 0;

            background: none;
            border: none;

            color: #111;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 1px;

            text-decoration: underline;

            cursor: pointer;
        }


        /* =========================================
           CART SUMMARY
        ========================================= */

        .cart-summary {
            margin-top: 45px;

            padding: 30px 0;

            border-top: 1px solid #111;

            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 30px;
        }

        .cart-summary > div span {
            font-size: 13px;

            letter-spacing: 1.5px;

            font-weight: 700;
        }

        .cart-total {
            margin-top: 8px;

            font-size: 30px;

            font-weight: 700;
        }


        /* =========================================
           CHECKOUT BUTTON
        ========================================= */

        .checkout-btn {
            min-width: 210px;
            min-height: 54px;

            padding: 0 35px;

            background: #111;
            color: #fff;

            border: 1px solid #111;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 1.5px;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        .checkout-btn:hover {
            background: #fff;
            color: #111;
        }


        /* =========================================
           EMPTY CART
        ========================================= */

        .empty-cart {
            padding: 60px 20px;

            text-align: center;

            border-top: 1px solid #ddd;
        }

        .empty-cart h2 {
            margin-bottom: 15px;
        }

        .continue-shopping {
            display: inline-flex;

            margin-top: 20px;

            padding: 15px 25px;

            background: #111;
            color: #fff;

            text-decoration: none;

            font-weight: 700;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .cart-page {
                margin: 40px auto;

                padding: 0 15px;
            }


            .cart-title {
                margin-bottom: 30px;
            }

            .cart-title h1 {
                font-size: 34px;
            }


            /* PRODUCT */

            .cart-item {
                display: grid;

                grid-template-columns: 105px 1fr;

                gap: 22px;

                padding: 30px 0;
            }


            /* IMAGE */

            .cart-item-image {
                width: 105px;
                max-width: 105px;
            }

            .cart-item-image img {
                width: 105px;
                max-width: 105px;
                height: auto;
            }


            /* INFO */

            .cart-item-info {
                padding-top: 0;
            }

            .cart-item-info h2 {
                margin-bottom: 18px;

                font-size: 21px;
                line-height: 1.2;
            }

            .cart-item-info p {
                margin: 11px 0;

                font-size: 16px;
            }

            .cart-item-price {
                margin-top: 22px !important;

                font-size: 22px !important;
            }


            /* QUANTITY */

            .quantity {
                margin-top: 20px;

                gap: 10px;
            }

            .quantity button {
                width: 34px;
                height: 34px;
            }


            /* REMOVE */

            .remove-item {
                margin-top: 18px;
            }


            /* SUMMARY */

            .cart-summary {
                flex-direction: column;

                align-items: stretch;

                gap: 22px;

                margin-top: 30px;
            }


            .cart-total {
                font-size: 26px;
            }


            .checkout-btn {
                width: 100%;

                min-height: 54px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================

    ========================================= -->

        <a

            </a>

            <a href="contact.html">

            </a>

        <!-- SEARCH + CART -->

        <div class="nav-icons">


            <!-- SEARCH -->

          <button

        aria-label="Search">

    </button>


            <!-- CART -->

            <button
                type="button"

    <!-- =========================================

    ========================================= -->

    <div
        class="search-box"
        id="searchBox">

        <form id="searchForm">

            <input
                type="search"

                placeholder="Search products..."
                autocomplete="off">


            <button
                type="button"

                class="close-search"
                aria-label="Close search">

                ×

            </button>

        </form>

    </div>


    <!-- =========================================
         CART
    ========================================= -->

    <main>

        <section class="cart-page">


            <!-- CART TITLE -->

            <div class="cart-title">

                <p>
                    SET APART COLLECTION
                </p>

                <h1>
                    YOUR CART
                </h1>

            </div>


            <!-- CART CONTENT -->

            <div id="cartContent"></div>

        </section>

    </main>


    <!-- =========================================
         FOOTER
    ========================================= -->

    <footer class="footer">


        <div class="footer-brand">

            <img
                src="LOGO (2).png"
                alt="SET APART Logo">

            <p>
                Faith-Inspired Streetwear.
            </p>

            <p>
                Called to Live Differently.
            </p>

        </div>


        <div class="footer-links">


            <!-- SHOP -->

            <div>

                <h3>
                    SHOP
                </h3>

                <a href="shop.html">

                </a>

                <a href="shop.html">

            <!-- ABOUT -->

            <div>

                <h3>

    <!-- =========================================
         MAIN WEBSITE JAVASCRIPT
    ========================================= -->

    <script src="script.js"></script>


    <!-- =========================================
         CART JAVASCRIPT
    ========================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================
                   CART CONTENT
                ================================= */

                const cartContent =
                    document.getElementById(
                        "cartContent"
                    );


                let cart = null;


                /* =================================
                   READ CART
                ================================= */

                try {

                    const savedCart =
                        localStorage.getItem(
                            "setApartCart"
                        );

                    if (savedCart) {

                        cart =
                            JSON.parse(savedCart);

                    }

                } catch (error) {

                    cart = null;

                }


                /* =================================
                   CART COUNT
                ================================= */

                function refreshCartCount() {

                    const cartCount =
                        document.getElementById(
                            "cartCount"
                        );


                    if (!cartCount) {
                        return;
                    }


                    if (!cart) {

                        cartCount.textContent = "0";

                        cartCount.style.display =
                            "none";

                        return;

                    }


                    const quantity =
                        Number(cart.quantity) || 0;


                    if (quantity > 0) {

                        cartCount.textContent =
                            quantity;

                        cartCount.style.display =
                            "flex";

                    } else {

                        cartCount.textContent =
                            "0";

                        cartCount.style.display =
                            "none";

                    }

                }


                /* =================================
                   DISPLAY CART
                ================================= */

                function displayCart() {


                    /* =================================
                       EMPTY CART
                    ================================= */

                    if (!cart) {

                        cartContent.innerHTML = `

                            <div class="empty-cart">

                                <h2>
                                    YOUR CART IS EMPTY.
                                </h2>

                                <p>
                                    Add a product to your cart
                                    to get started.
                                </p>

                                <a
                                    href="shop.html"
                                    class="continue-shopping">

                                    CONTINUE SHOPPING

                                </a>

                            </div>

                        `;


                        refreshCartCount();

                        return;

                    }


                    /* =================================
                       PRODUCT DATA
                    ================================= */

                    const price =
                        Number(cart.price) || 44.99;


                    const quantity =
                        Number(cart.quantity) || 1;


                    const total =
                        price * quantity;


                    const productName =
                        cart.name ||
                        "SET APART HOODIE";


                    const productColor =
                        cart.color ||
                        "BLACK";


                    const productSize =
                        cart.size ||
                        "S";


                    const productImage =
                        cart.image ||
                        "PILGRIM BLACK FRONT 1.png";


                    /* =================================
                       CART HTML
                    ================================= */

                    cartContent.innerHTML = `

                        <div class="cart-item">


                            <!-- PRODUCT IMAGE -->

                            <div class="cart-item-image">

                                <img
                                    src="${productImage}"
                                    alt="${productName}">

                            </div>


                            <!-- PRODUCT INFORMATION -->

                            <div class="cart-item-info">

                                <h2>
                                    ${productName}
                                </h2>


                                <p>

                                    COLOR:

                                    <strong>
                                        ${productColor}
                                    </strong>

                                </p>


                                <p>

                                    SIZE:

                                    <strong>
                                        ${productSize}
                                    </strong>

                                </p>


                                <p>

                                    QUANTITY:

                                    <strong>
                                        ${quantity}
                                    </strong>

                                </p>


                                <p class="cart-item-price">

                                    $

                                    ${price.toFixed(2)}

                                </p>


                                <!-- QUANTITY CONTROLS -->

                                <div class="quantity">

                                    <button
                                        type="button"
                                        id="decrease"
                                        aria-label="Decrease quantity">

                                        −

                                    </button>


                                    <span>

                                        ${quantity}

                                    </span>


                                    <button
                                        type="button"
                                        id="increase"
                                        aria-label="Increase quantity">

                                        +

                                    </button>

                                </div>


                                <!-- REMOVE -->

                                <button
                                    type="button"
                                    class="remove-item"
                                    id="removeItem">

                                    REMOVE

                                </button>

                            </div>

                        </div>


                        <!-- =================================
                             SUMMARY
                        ================================= -->

                        <div class="cart-summary">


                            <div>

                                <span>
                                    TOTAL
                                </span>

                                <div class="cart-total">

                                    $

                                    ${total.toFixed(2)}

                                </div>

                            </div>


                            <button
                                type="button"
                                class="checkout-btn"
                                id="checkoutBtn">

                                CHECKOUT

                            </button>

                        </div>

                    `;


                    /* =================================
                       INCREASE
                    ================================= */

                    const increase =
                        document.getElementById(
                            "increase"
                        );


                    if (increase) {

                        increase.addEventListener(
                            "click",
                            function () {

                                cart.quantity =
                                    Number(
                                        cart.quantity
                                    ) + 1;


                                saveCart();

                            }
                        );

                    }


                    /* =================================
                       DECREASE
                    ================================= */

                    const decrease =
                        document.getElementById(
                            "decrease"
                        );


                    if (decrease) {

                        decrease.addEventListener(
                            "click",
                            function () {

                                const currentQuantity =
                                    Number(
                                        cart.quantity
                                    ) || 1;


                                if (
                                    currentQuantity > 1
                                ) {

                                    cart.quantity =
                                        currentQuantity - 1;


                                    saveCart();

                                }

                            }
                        );

                    }


                    /* =================================
                       REMOVE
                    ================================= */

                    const removeItem =
                        document.getElementById(
                            "removeItem"
                        );


                    if (removeItem) {

                        removeItem.addEventListener(
                            "click",
                            function () {

                                localStorage.removeItem(
                                    "setApartCart"
                                );


                                cart = null;


                                refreshCartCount();

                                displayCart();

                            }
                        );

                    }


                    /* =================================
                       CHECKOUT
                    ================================= */

                    const checkoutBtn =
                        document.getElementById(
                            "checkoutBtn"
                        );


                    if (checkoutBtn) {

                        checkoutBtn.addEventListener(
                            "click",
                            function () {

                                if (!cart) {

                                    alert(
                                        "YOUR CART IS EMPTY."
                                    );

                                    return;

                                }


                                /*
                                 * SAVE CART AGAIN
                                 * BEFORE PAYMENT
                                 */

                                localStorage.setItem(
                                    "setApartCart",
                                    JSON.stringify(cart)
                                );


                                /*
                                 * GO TO PAYMENT
                                 */

                                window.location.href =
                                    "payment.html";

                            }
                        );

                    }


                    refreshCartCount();

                }


                /* =================================
                   SAVE CART
                ================================= */

                function saveCart() {

                    if (!cart) {
                        return;
                    }


                    localStorage.setItem(
                        "setApartCart",
                        JSON.stringify(cart)
                    );


                    refreshCartCount();

                    displayCart();

                }


                /* =================================
                   CART NAV BUTTON
                ================================= */

                const cartButton =
                    document.getElementById(
                        "cartButton"
                    );


                if (cartButton) {

                    cartButton.addEventListener(
                        "click",
                        function () {

                            window.location.href =
                                "cart.html";

                        }
                    );

                }


                /* =================================
                   START
                ================================= */

                displayCart();


                /* =================================
                   UPDATE WHEN STORAGE CHANGES
                ================================= */

                window.addEventListener(
                    "storage",
                    function () {

                        try {

                            const savedCart =
                                localStorage.getItem(
                                    "setApartCart"
                                );


                            cart =
                                savedCart
                                    ? JSON.parse(
                                        savedCart
                                    )
                                    : null;


                            refreshCartCount();

                            displayCart();

                        } catch (error) {

                            cart = null;

                            refreshCartCount();

                            displayCart();

                        }

                    }
                );

            }

        );

    </script>


</body>

</html>
